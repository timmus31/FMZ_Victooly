<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance V - Mes Convois</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff9800;
            --text: #ffffff;
            --text-dim: #aaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; text-align: center; color: var(--accent); margin-top: 0; }
        p { font-size: 0.95rem; color: var(--text-dim); line-height: 1.4; }
        .step { background: #2a2a2a; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button.secondary {
            background-color: #333;
            color: #fff;
            margin-top: 8px;
        }
        .convoy-item {
            border-bottom: 1px solid #333;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .convoy-item:last-child { border-bottom: none; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-giver { background-color: #e53935; color: #fff; }
        .badge-receiver { background-color: #43a047; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Alliance V — Convois</h1>

        <!-- Formulaire de Connexion -->
        <div id="login-box">
            <p>Pour voir tes convois du jour :</p>
            
            <div class="step">
                <b>1.</b> Ouvre ce lien dans ton navigateur pour copier ton token :<br>
                <a href="https://s5.fourmizzz.fr/api.php?getToken" target="_blank" style="color: var(--accent);">
                    https://s5.fourmizzz.fr/api.php?getToken
                </a>
            </div>

            <div class="step">
                <b>2.</b> Colle ton token ci-dessous :
            </div>

            <input type="text" id="token-input" placeholder="Ex: 8a9f... ou 123456">
            <button onclick="handleLogin()">Voir mes convois</button>
        </div>

        <!-- Zone d'affichage des convois -->
        <div id="convoys-box" style="display:none;">
            <div id="convoys-list">Chargement...</div>
            <button class="secondary" onclick="logout()">Changer de Token / Déconnexion</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "TA_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "TA_SUPABASE_ANON_KEY";

        // Auto-connexion si le token est déjà sauvé dans le téléphone
        window.onload = () => {
            const savedToken = localStorage.getItem('fourmizzz_token');
            if (savedToken) {
                document.getElementById('token-input').value = savedToken;
                fetchConvoys(savedToken);
            }
        };

        function handleLogin() {
            const token = document.getElementById('token-input').value.trim();
            if (!token) return alert("Colle ton token avant de valider !");
            
            // Sauvegarde locale pour éviter de devoir le recoller la prochaine fois
            localStorage.setItem('fourmizzz_token', token);
            fetchConvoys(token);
        }

        async function fetchConvoys(token) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('convoys-box').style.display = 'block';
            document.getElementById('convoys-list').innerHTML = "<p style='text-align:center;'>Vérification du token...</p>";

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_my_convoys`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_token: token })
                });

                if (!response.ok) {
                    throw new Error("Token invalide ou tu ne fais pas partie des membres actifs de l'alliance.");
                }

                const convoys = await response.json();
                renderConvoys(convoys);

            } catch (err) {
                alert("Erreur : " + err.message);
                logout();
            }
        }

        function renderConvoys(convoys) {
            const container = document.getElementById('convoys-list');

            if (!convoys || convoys.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding: 20px 0;'>🎉 Aucun convoi à réaliser aujourd'hui !</p>";
                return;
            }

            let html = `<h3>Tes Convois à effectuer :</h3>`;

            convoys.forEach(c => {
                const badgeClass = c.is_giver ? 'badge-giver' : 'badge-receiver';
                const roleText = c.is_giver ? 'ENVOYER À' : 'RECEVOIR DE';
                const statusText = c.status === 'pending' ? '⏳ En attente' : '✅ Fait';

                html += `
                <div class="convoy-item">
                    <div>
                        <span class="badge ${badgeClass}">${roleText}</span>
                        <div style="font-size: 1.1rem; font-weight: bold; margin-top: 4px;">${c.target_pseudo}</div>
                        <div style="font-size: 0.85rem; color: #aaa;">Statut: ${statusText}</div>
                    </div>
                    <div style="text-align: right; font-weight: bold; font-size: 1.1rem; color: var(--accent);">
                        ${c.amount.toLocaleString('fr-FR')} cm²
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function logout() {
            localStorage.removeItem('fourmizzz_token');
            document.getElementById('token-input').value = '';
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('convoys-box').style.display = 'none';
        }
    </script>
</body>
</html>
