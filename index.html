<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance V — Gestion des Convois</title>
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --primary-hover: #1a252f;
            --accent: #e67e22;
            --success: #27ae60;
            --danger: #e74c3c;
            --group-color: #2980b9;
            --admin-color: #8e44ad;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --text-muted: #7f8c8d;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            width: 100%;
            max-width: 840px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .header-title { font-size: 1.5rem; color: var(--primary); margin: 0 0 20px 0; text-align: center; }

        .token-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .token-step { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--primary); }

        .token-btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button.btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            background: #edf2f7;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .tab-btn.active { background: var(--primary); color: white; }
        .tab-btn.group-active { background: var(--group-color); color: white; }
        .tab-btn.admin-active { background: var(--admin-color); color: white; }

        .btn-logout {
            margin-left: auto;
            background: #e2e8f0;
            color: #4a5568;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .table-container { overflow-x: auto; margin-bottom: 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: white;
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.75rem;
            color: white;
            display: inline-block;
        }
        .badge-pending { background: var(--accent); }
        .badge-failed { background: var(--danger); }
        .badge-success { background: var(--success); }
        .badge-superadmin { background: var(--danger); }
        .badge-admin { background: var(--admin-color); }
        .badge-chef { background: #d35400; }
        .badge-member { background: #95a5a6; }

        .btn-action {
            display: inline-block;
            padding: 6px 12px;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .role-select, .group-select {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
            background: #fff;
            color: var(--text);
            cursor: pointer;
        }
        .group-select { border-color: var(--group-color); color: var(--group-color); }

        .stats-summary {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 130px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-card .val { font-size: 1rem; font-weight: bold; color: var(--group-color); }
        .stat-card .lbl { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }

        .group-block-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--group-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .group-block-title {
            font-weight: bold;
            color: var(--group-color);
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="header-title">📦 Convois Alliance V</h1>

        <!-- Écran de connexion -->
        <div id="auth-section" class="token-box">
            <div class="token-step">1. Récupération du Token Fourmizzz</div>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0;">
                Générez un jeton éphémère depuis votre compte de jeu :
            </p>
            <a href="https://s5.fourmizzz.fr/api.php?getToken" target="_blank" class="token-btn">🔑 Obtenir mon Token</a>
            
            <br><br>
            <div class="token-step">2. Validation de session (12h)</div>
            <input type="text" 
                   id="token-input" 
                   placeholder="Coller le token ou le JSON complet ici (ex: 6ace5bb10f2a6)" 
                   onpaste="setTimeout(() => { this.value = cleanTokenInput(this.value); }, 10)">
            <button class="btn-primary" onclick="handleAuth()">Connexion au Tableau</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section" style="display:none;">
            <div class="nav-tabs">
                <button id="tab-active-btn" class="tab-btn active" onclick="switchTab('active')">En cours</button>
                <button id="tab-history-btn" class="tab-btn" onclick="switchTab('history')">📜 Historique</button>
                <button id="tab-group-btn" class="tab-btn" onclick="switchTab('group')">👥 Groupe</button>
                <button id="tab-admin-btn" class="tab-btn" style="display:none;" onclick="switchTab('admin')">⚙️ Admin</button>
                <button class="btn-logout" onclick="logout()">Changer de session</button>
            </div>

            <div id="content-area">Chargement des données...</div>
        </div>
    </div>

    <script>
        let activeTab = 'active';
        let currentUserAdminInfo = { isAdmin: false, isSuperAdmin: false };
        let selectedGroupId = null;

        window.onload = () => {
            const savedSessionToken = localStorage.getItem('alliance_session_token');
            if (savedSessionToken) {
                checkAdminStatus();
            } else {
                logout();
            }
        };

        function cleanTokenInput(rawInput) {
            if (!rawInput) return '';
            let cleaned = rawInput.trim();
        
            // 1. Tente de parser si le joueur a collé le JSON complet
            if (cleaned.startsWith('{') && cleaned.endsWith('}')) {
                try {
                    const parsed = JSON.parse(cleaned);
                    if (parsed.Token) return parsed.Token.trim();
                    if (parsed.token) return parsed.token.trim();
                } catch (e) {
                    // Si le JSON est malformé, on continue avec les regex
                }
            }
        
            // 2. Si le joueur a collé {"Token":"xyz"} sous forme de chaîne brute
            const jsonMatch = cleaned.match(/"Token"\s*:\s*"([^"]+)"/i);
            if (jsonMatch && jsonMatch[1]) {
                return jsonMatch[1].trim();
            }
        
            // 3. Suppression des guillemets simples/doubles/crochets résiduels autour du token
            cleaned = cleaned.replace(/^["'\[\s]+\vert{}["'\]\s]+$/g, '');
        
            return cleaned;
        }
        
        async function handleAuth() {
            const rawInput = document.getElementById('token-input').value;
            const cleanedToken = cleanTokenInput(rawInput);
        
            document.getElementById('token-input').value = cleanedToken;
        
            if (!cleanedToken) {
                return alert("Veuillez saisir un token Fourmizzz valide.");
            }
        
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/login_with_fourmizzz_token`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_fourmizzz_token: cleanedToken })
                });
        
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Token invalide.");
        
                const sessionData = data[0];
                localStorage.setItem('alliance_session_token', sessionData.session_token);
        
                checkAdminStatus();
            } catch (err) {
                alert("❌ Connexion échouée : " + err.message);
            }
        }

        function showDashboard() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
        }

        async function checkAdminStatus() {
            const sessionToken = localStorage.getItem('alliance_session_token');
            if (!sessionToken) return logout();

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/check_is_admin`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p_session_token: sessionToken })
                });

                if (!res.ok) return logout();

                const data = await res.json();
                if (data && data.length > 0) {
                    currentUserAdminInfo = { isAdmin: data[0].is_admin, isSuperAdmin: data[0].is_superadmin };
                    if (currentUserAdminInfo.isAdmin) {
                        document.getElementById('tab-admin-btn').style.display = 'inline-block';
                    } else {
                        document.getElementById('tab-admin-btn').style.display = 'none';
                    }
                    showDashboard();
                    loadTabContent();
                } else {
                    logout();
                }
            } catch (e) {
                console.error("Erreur check_is_admin", e);
                logout();
            }
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-active-btn').className = `tab-btn ${tab === 'active' ? 'active' : ''}`;
            document.getElementById('tab-history-btn').className = `tab-btn ${tab === 'history' ? 'active' : ''}`;
            document.getElementById('tab-group-btn').className = `tab-btn ${tab === 'group' ? 'group-active' : ''}`;
            document.getElementById('tab-admin-btn').className = `tab-btn ${tab === 'admin' ? 'admin-active' : ''}`;
            loadTabContent();
        }

        async function loadTabContent() {
            const sessionToken = localStorage.getItem('alliance_session_token');
            if (!sessionToken) return logout();

            const contentDiv = document.getElementById('content-area');
            contentDiv.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Chargement en cours...</p>";

            if (activeTab === 'admin') { loadAdminPanel(); return; }
            if (activeTab === 'group') { loadGroupConvoys(selectedGroupId); return; }

            const rpcEndpoint = activeTab === 'active' ? 'get_my_convoys' : 'get_my_convoy_history';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${rpcEndpoint}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p_session_token: sessionToken })
                });

                if (!response.ok) return logout();

                const data = await response.json();

                if (activeTab === 'active') renderActiveConvoys(data);
                else renderHistoryConvoys(data);

            } catch (err) {
                logout();
            }
        }

        function renderActiveConvoys(convoys) {
            const contentDiv = document.getElementById('content-area');
            const toSend = convoys.filter(c => c.is_sender);
            const toReceive = convoys.filter(c => !c.is_sender);

            let html = `<div style="font-weight:bold; color: var(--accent); margin: 15px 0 10px 0;">📤 Convois à envoyer</div>`;
            html += renderTable(toSend, true);

            html += `<div style="font-weight:bold; color: var(--success); margin: 25px 0 10px 0;">📥 Convois à recevoir</div>`;
            html += renderTable(toReceive, false);

            contentDiv.innerHTML = html;
        }

        function renderTable(list, isSender) {
            if (list.length === 0) return `<p style="color:var(--text-muted); font-style:italic;">Aucun convoi dans cette catégorie.</p>`;

            let html = `<div class="table-container"><table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Joueur</th>
                        <th>Montant</th>
                        <th>Statut</th>
                        ${isSender ? '<th>Action</th>' : ''}
                    </tr>
                </thead>
                <tbody>`;

            list.forEach(c => {
                const target = isSender ? c.to_player_pseudo : c.from_player_pseudo;
                const targetId = isSender ? c.to_player_id : c.from_player_id;
                const isFailed = c.status === 'failed';

                const statusBadge = isFailed 
                    ? `<span class="badge badge-failed">⚠️ Échoué</span>`
                    : `<span class="badge badge-pending">En attente</span>`;

                const actionBtn = isSender ? `
                    <a href="https://s5.fourmizzz.fr/commerce.php?ID=${targetId}&auto_convoy_id=${c.id}&auto_amount=${c.amount}" 
                       target="_blank" 
                       class="btn-action" 
                       style="background:${isFailed ? 'var(--danger)' : 'var(--accent)'};">
                        ${isFailed ? '🔄 Réessayer' : '🚀 Envoyer'}
                    </a>
                ` : '';

                html += `<tr class="${isFailed ? 'row-failed' : ''}">
                    <td>${c.balance_date}</td>
                    <td><strong>${escapeHtml(target)}</strong></td>
                    <td><strong>${Number(c.amount).toLocaleString('fr-FR')}</strong> Matériaux</td>
                    <td>${statusBadge}</td>
                    ${isSender ? `<td>${actionBtn}</td>` : ''}
                </tr>`;
            });

            return html + `</tbody></table></div>`;
        }

        function renderHistoryConvoys(historyList) {
            const contentDiv = document.getElementById('content-area');
            if (historyList.length === 0) {
                contentDiv.innerHTML = `<p style="color:var(--text-muted); font-style:italic;">Aucun convoi complété récemment.</p>`;
                return;
            }

            let html = `<div class="table-container"><table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Partenaire</th>
                        <th>Montant</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>`;

            historyList.forEach(c => {
                const target = c.is_sender ? c.to_player_pseudo : c.from_player_pseudo;
                const typeText = c.is_sender 
                    ? '<span style="color: var(--accent); font-weight: bold;">📤 Envoyé</span>' 
                    : '<span style="color: var(--success); font-weight: bold;">📥 Reçu</span>';

                html += `<tr>
                    <td>${c.balance_date}</td>
                    <td>${typeText}</td>
                    <td><strong>${escapeHtml(target)}</strong></td>
                    <td>${Number(c.amount).toLocaleString('fr-FR')} Matériaux</td>
                    <td><span class="badge badge-success">✅ Complété</span></td>
                </tr>`;
            });

            contentDiv.innerHTML = html + `</tbody></table></div>`;
        }

        /* --- ONGLET GROUPE --- */

        async function loadGroupConvoys(targetGroupId = null) {
            const sessionToken = localStorage.getItem('alliance_session_token');
            const contentDiv = document.getElementById('content-area');

            try {
                const bodyParams = { p_session_token: sessionToken };
                if (targetGroupId) bodyParams.p_target_group_id = parseInt(targetGroupId);

                // 1. Convois du groupe
                const resConvoys = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_my_group_convoys`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyParams)
                });
                if (!resConvoys.ok) return logout();
                const convoysData = await resConvoys.json();

                // 2. Logs quotidiens du groupe
                const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_group_daily_logs`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyParams)
                });
                const logsData = resLogs.ok ? await resLogs.json() : [];

                // 3. Performance individuelle des joueurs du groupe
                let playerPerfsData = [];
                if (targetGroupId !== -1) {
                    const resPerfs = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_group_player_performances`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyParams)
                    });
                    if (resPerfs.ok) playerPerfsData = await resPerfs.json();
                }

                // 4. Groupes disponibles pour les admins
                let availableGroups = [];
                if (currentUserAdminInfo.isAdmin) {
                    const groupsRes = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_available_groups`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' }
                    });
                    if (groupsRes.ok) availableGroups = await groupsRes.json();
                }

                const currentGroupId = targetGroupId !== null ? parseInt(targetGroupId) : (convoysData.length > 0 ? convoysData[0].group_id : (logsData.length > 0 ? logsData[0].group_id : null));
                selectedGroupId = currentGroupId;

                renderGroupConvoysTable(convoysData, logsData, playerPerfsData, currentGroupId, availableGroups);

            } catch (e) {
                logout();
            }
        }

        function renderGroupConvoysTable(convoys, dailyLogs, playerPerfs, currentGroupId, availableGroups) {
            const contentDiv = document.getElementById('content-area');

            let groupSelectorHtml = currentGroupId === -1 ? '🌐 Tous les groupes' : `Groupe #${currentGroupId}`;
            
            if (currentUserAdminInfo.isAdmin) {
                let options = `<option value="-1" ${currentGroupId === -1 ? 'selected' : ''}>🌐 Tous les groupes (Global)</option>`;
                options += availableGroups.map(g => 
                    `<option value="${g.group_id}" ${g.group_id == currentGroupId ? 'selected' : ''}>Groupe #${g.group_id}</option>`
                ).join('');

                groupSelectorHtml = `
                    <select class="group-select" onchange="loadGroupConvoys(this.value)">
                        ${options}
                    </select>
                `;
            }

            let html = `
                <div style="font-weight:bold; color: var(--group-color); margin: 15px 0 5px 0; font-size: 1.1rem; display:flex; align-items:center; gap:10px;">
                    👥 Suivi : ${groupSelectorHtml}
                </div>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;">
                    Statistiques de terrain, performances des joueurs et convois associés.
                </p>`;

            // --- VUE GLOBALE (TOUS LES GROUPES) ---
            if (currentGroupId === -1) {
                if (dailyLogs.length > 0) {
                    const latestDate = dailyLogs[0].log_date;
                    const todayLogs = dailyLogs.filter(l => l.log_date === latestDate);

                    let sumStart = 0, sumEnd = 0, sumDiff = 0, sumRes = 0;
                    todayLogs.forEach(l => {
                        sumStart += l.start_terrain;
                        sumEnd += l.end_terrain;
                        sumDiff += l.terrain_diff;
                        sumRes += l.resources_generated;
                    });

                    const diffFormatted = sumDiff >= 0 ? `+${sumDiff.toLocaleString('fr-FR')}` : sumDiff.toLocaleString('fr-FR');

                    html += `
                        <div style="font-weight:bold; margin: 15px 0 8px 0; font-size:0.95rem; color:var(--primary);">
                            📊 Total Alliance (Aujourd'hui)
                        </div>
                        <div class="stats-summary">
                            <div class="stat-card">
                                <div class="val">${sumStart.toLocaleString('fr-FR')} cm²</div>
                                <div class="lbl">Terrain Départ Total</div>
                            </div>
                            <div class="stat-card">
                                <div class="val">${sumEnd.toLocaleString('fr-FR')} cm²</div>
                                <div class="lbl">Terrain Actuel Total</div>
                            </div>
                            <div class="stat-card">
                                <div class="val" style="color:${sumDiff >= 0 ? 'var(--success)' : 'var(--danger)'}">${diffFormatted} cm²</div>
                                <div class="lbl">Évolution Totale</div>
                            </div>
                            <div class="stat-card">
                                <div class="val" style="color:var(--accent);">${sumRes.toLocaleString('fr-FR')}</div>
                                <div class="lbl">Total Ressources Générées</div>
                            </div>
                        </div>
                    `;

                    todayLogs.sort((a, b) => a.group_id - b.group_id);

                    html += `<div style="font-weight:bold; margin: 25px 0 10px 0; font-size:0.95rem; color:var(--primary);">
                        📌 Détail par Groupe (Ordre 1 à ${todayLogs.length})
                    </div>`;

                    todayLogs.forEach(log => {
                        const gDiff = log.terrain_diff >= 0 ? `+${log.terrain_diff.toLocaleString('fr-FR')}` : log.terrain_diff.toLocaleString('fr-FR');
                        
                        html += `
                            <div class="group-block-card">
                                <div class="group-block-title">
                                    <span>Groupe #${log.group_id}</span>
                                    <button class="btn-action" style="background:var(--group-color); font-size:0.7rem; padding:3px 8px;" onclick="loadGroupConvoys(${log.group_id})">
                                        Voir le groupe ➔
                                    </button>
                                </div>
                                <div class="stats-summary" style="margin-bottom:0;">
                                    <div class="stat-card" style="background:#fff;">
                                        <div class="val" style="font-size:0.9rem;">${log.start_terrain.toLocaleString('fr-FR')} cm²</div>
                                        <div class="lbl">Départ</div>
                                    </div>
                                    <div class="stat-card" style="background:#fff;">
                                        <div class="val" style="font-size:0.9rem;">${log.end_terrain.toLocaleString('fr-FR')} cm²</div>
                                        <div class="lbl">Fin</div>
                                    </div>
                                    <div class="stat-card" style="background:#fff;">
                                        <div class="val" style="font-size:0.9rem; color:${log.terrain_diff >= 0 ? 'var(--success)' : 'var(--danger)'}">${gDiff} cm²</div>
                                        <div class="lbl">Gain</div>
                                    </div>
                                    <div class="stat-card" style="background:#fff;">
                                        <div class="val" style="font-size:0.9rem; color:var(--accent);">${log.resources_generated.toLocaleString('fr-FR')}</div>
                                        <div class="lbl">Ressources</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            } 
            // --- VUE GROUPE UNIQUE ---
            else if (dailyLogs.length > 0) {
                const todayLog = dailyLogs[0];
                const diffFormatted = todayLog.terrain_diff >= 0 ? `+${todayLog.terrain_diff.toLocaleString('fr-FR')}` : todayLog.terrain_diff.toLocaleString('fr-FR');

                html += `
                    <div class="stats-summary">
                        <div class="stat-card">
                            <div class="val">${todayLog.start_terrain.toLocaleString('fr-FR')} cm²</div>
                            <div class="lbl">Terrain Départ</div>
                        </div>
                        <div class="stat-card">
                            <div class="val">${todayLog.end_terrain.toLocaleString('fr-FR')} cm²</div>
                            <div class="lbl">Terrain Actuel</div>
                        </div>
                        <div class="stat-card">
                            <div class="val" style="color:${todayLog.terrain_diff >= 0 ? 'var(--success)' : 'var(--danger)'}">${diffFormatted} cm²</div>
                            <div class="lbl">Évolution du Terrain</div>
                        </div>
                        <div class="stat-card">
                            <div class="val" style="color:var(--accent);">${todayLog.resources_generated.toLocaleString('fr-FR')}</div>
                            <div class="lbl">Ressources Générées</div>
                        </div>
                    </div>
                `;
            }

            // --- TABLEAU : PERFORMANCE INDIVIDUELLE DES JOUEURS ---
            if (currentGroupId !== -1 && playerPerfs.length > 0) {
                html += `
                    <div style="font-weight:bold; margin: 25px 0 10px 0; font-size:0.95rem; color:var(--primary);">
                        👤 Performance des Joueurs du Groupe
                    </div>
                    <div class="table-container"><table>
                        <thead>
                            <tr>
                                <th>Joueur</th>
                                <th>Terrain Départ</th>
                                <th>Terrain Actuel</th>
                                <th>Évolution</th>
                                <th>Ressources Générées</th>
                            </tr>
                        </thead>
                        <tbody>`;

                playerPerfs.forEach(p => {
                    const pDiffText = p.terrain_diff >= 0 ? `+${p.terrain_diff.toLocaleString('fr-FR')}` : p.terrain_diff.toLocaleString('fr-FR');
                    const pDiffColor = p.terrain_diff >= 0 ? 'var(--success)' : 'var(--danger)';

                    html += `<tr>
                        <td><strong>${escapeHtml(p.pseudo)}</strong></td>
                        <td>${p.start_terrain.toLocaleString('fr-FR')} cm²</td>
                        <td><strong>${p.end_terrain.toLocaleString('fr-FR')} cm²</strong></td>
                        <td><strong style="color:${pDiffColor}">${pDiffText} cm²</strong></td>
                        <td><strong style="color:var(--accent);">${p.resources_generated.toLocaleString('fr-FR')}</strong></td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
            }

            // --- TABLEAU DES CONVOIS ---
            html += `<div style="font-weight:bold; margin: 25px 0 10px 0; font-size:0.95rem;">📦 Convois ${currentGroupId === -1 ? 'de toute l\'Alliance' : 'du Groupe'}</div>`;
            if (convoys.length === 0) {
                html += `<p style="color:var(--text-muted); font-style:italic;">Aucun convoi enregistré.</p>`;
            } else {
                html += `<div class="table-container"><table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            ${currentGroupId === -1 ? '<th>Grp</th>' : ''}
                            <th>Expéditeur</th>
                            <th>Destinataire</th>
                            <th>Montant</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody>`;

                convoys.forEach(c => {
                    let badge = '<span class="badge badge-pending">En attente</span>';
                    if (c.status === 'completed') badge = '<span class="badge badge-success">✅ Complété</span>';
                    else if (c.status === 'failed') badge = '<span class="badge badge-failed">⚠️ Échoué</span>';

                    html += `<tr>
                        <td>${c.balance_date}</td>
                        ${currentGroupId === -1 ? `<td><strong>#${c.group_id}</strong></td>` : ''}
                        <td><strong>${escapeHtml(c.from_player_pseudo)}</strong></td>
                        <td><strong>${escapeHtml(c.to_player_pseudo)}</strong></td>
                        <td>${Number(c.amount).toLocaleString('fr-FR')} Matériaux</td>
                        <td>${badge}</td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
            }

            contentDiv.innerHTML = html;
        }

        /* --- PANNEAU D ADMINISTRATION --- */

        async function loadAdminPanel() {
            const sessionToken = localStorage.getItem('alliance_session_token');
            const contentDiv = document.getElementById('content-area');

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_alliance_admin_list`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p_session_token: sessionToken })
                });

                if (!res.ok) return logout();

                const data = await res.json();
                renderAdminTable(data);
            } catch (e) {
                logout();
            }
        }

        function renderAdminTable(members) {
            const contentDiv = document.getElementById('content-area');

            let html = `
                <div style="font-weight:bold; color: var(--admin-color); margin: 15px 0 5px 0; font-size: 1.1rem;">
                    ⚙️ Gestion des Rôles de l'Alliance
                </div>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;">
                    Seul le Super Admin (<strong>Stroke</strong>) peut modifier les attributions de rôles.
                </p>
                <div class="table-container"><table>
                    <thead>
                        <tr>
                            <th>Joueur</th>
                            <th style="text-align:center;">Rôle Actuel</th>
                            ${currentUserAdminInfo.isSuperAdmin ? '<th style="text-align:center;">Modifier le Rôle</th>' : ''}
                        </tr>
                    </thead>
                    <tbody>`;

            members.forEach(m => {
                let badge = '<span class="badge badge-member">Membre</span>';
                if (m.role === 'superadmin') badge = '<span class="badge badge-superadmin">👑 Super Admin</span>';
                else if (m.role === 'admin') badge = '<span class="badge badge-admin">🛡️ Admin</span>';
                else if (m.role === 'chef_de_rang') badge = '<span class="badge badge-chef">🎖️ Chef de rang</span>';

                let actionElement = '';
                if (currentUserAdminInfo.isSuperAdmin) {
                    if (m.role === 'superadmin') {
                        actionElement = '<em style="color:var(--text-muted); font-size:0.75rem;">Inmodifiable</em>';
                    } else {
                        actionElement = `
                            <select class="role-select" onchange="updatePlayerRole(${m.player_id}, this.value)">
                                <option value="member" ${m.role === 'member' ? 'selected' : ''}>👤 Membre</option>
                                <option value="chef_de_rang" ${m.role === 'chef_de_rang' ? 'selected' : ''}>🎖️ Chef de rang</option>
                                <option value="admin" ${m.role === 'admin' ? 'selected' : ''}>🛡️ Admin</option>
                            </select>
                        `;
                    }
                }

                html += `<tr>
                    <td><strong>${escapeHtml(m.member_pseudo)}</strong></td>
                    <td style="text-align:center;">${badge}</td>
                    ${currentUserAdminInfo.isSuperAdmin ? `<td style="text-align:center;">${actionElement}</td>` : ''}
                </tr>`;
            });

            html += `</tbody></table></div>`;
            contentDiv.innerHTML = html;
        }

        async function updatePlayerRole(targetPlayerId, newRole) {
            const sessionToken = localStorage.getItem('alliance_session_token');

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/set_player_role`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p_session_token: sessionToken, p_target_player_id: parseInt(targetPlayerId), p_new_role: newRole })
                });

                if (res.ok) {
                    loadAdminPanel();
                } else {
                    const err = await res.json();
                    alert("❌ Action refusée : " + (err.message || "Seul le Super Admin peut modifier les rôles."));
                    loadAdminPanel();
                }
            } catch (e) {
                alert("❌ Erreur réseau.");
            }
        }

        function escapeHtml(str) {
            return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
        }

        function logout() {
            localStorage.removeItem('alliance_session_token');
            document.getElementById('token-input').value = '';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
        }
    </script>
</body>
</html>
