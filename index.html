<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance V — Diagnostic Convois</title>
    <script src="config.js"></script>
    <style>
        body { font-family: monospace; background: #0d0d0d; color: #00ff00; padding: 15px; margin: 0; }
        .card { background: #161616; border: 1px solid #333; padding: 15px; border-radius: 8px; max-width: 600px; margin: auto; }
        h2 { color: #ff9800; margin-top: 0; font-size: 1.2rem; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        input { background: #222; border: 1px solid #444; color: #fff; }
        button { background: #ff9800; border: none; color: #000; font-weight: bold; cursor: pointer; }
        #console-log {
            background: #000;
            border: 1px solid #222;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .log-time { color: #888; }
        .log-err { color: #ff5555; font-weight: bold; }
        .log-ok { color: #55ff55; font-weight: bold; }
        .log-info { color: #55ffff; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Alliance V — Console de Diagnostic</h2>
        
        <label style="color:#aaa; font-size:0.8rem;">Token Fourmizzz :</label>
        <input type="text" id="token-input" placeholder="Colle ton token ici...">
        <button onclick="runDiagnostic()">LANCER LE DIAGNOSTIC COMPLET</button>

        <div id="console-log">=== CONSOLE PRÊTE ===\nSaisis un token et clique sur le bouton.</div>
    </div>

    <script>
        function printLog(msg, type = 'info') {
            const consoleEl = document.getElementById('console-log');
            const now = new Date().toLocaleTimeString();
            let colorClass = 'log-info';
            if (type === 'err') colorClass = 'log-err';
            if (type === 'ok') colorClass = 'log-ok';

            const line = document.createElement('div');
            line.className = colorClass;
            line.innerHTML = `<span class="log-time">[${now}]</span> ${escapeHtml(msg)}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        async function runDiagnostic() {
            document.getElementById('console-log').innerHTML = '';
            printLog("Démarrage de la séquence de test...", 'info');

            // 1. Vérification de la configuration
            if (typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL) {
                printLog("CRITIQUE: SUPABASE_URL n'est pas définie dans config.js !", 'err');
                return;
            }
            if (typeof SUPABASE_ANON_KEY === 'undefined' || !SUPABASE_ANON_KEY) {
                printLog("CRITIQUE: SUPABASE_ANON_KEY n'est pas définie dans config.js !", 'err');
                return;
            }

            printLog(`CONFIG OK: URL=${SUPABASE_URL}`, 'ok');

            const token = document.getElementById('token-input').value.trim();
            if (!token) {
                printLog("ERREUR: Le champ token est vide !", 'err');
                return;
            }

            printLog(`TOKEN SAISI: "${token}" (Longueur: ${token.length})`, 'info');

            // 2. Construction de la requête
            const endpoint = `${SUPABASE_URL}/rest/v1/rpc/get_my_convoys`;
            const payload = { p_token: token };

            printLog(`ENVOI HTTP POST -> ${endpoint}`, 'info');
            printLog(`BODY PAYLOAD -> ${JSON.stringify(payload)}`, 'info');

            try {
                const startTime = performance.now();
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(payload)
                });
                const duration = Math.round(performance.now() - startTime);

                printLog(`RÉPONSE REÇUE en ${duration}ms | HTTP Status: ${response.status} ${response.statusText}`, response.ok ? 'ok' : 'err');

                const rawBody = await response.text();
                printLog(`CORPS BRUT REÇU:\n${rawBody}`, response.ok ? 'info' : 'err');

                if (response.ok) {
                    const data = JSON.parse(rawBody);
                    printLog(`SUCCÈS ! ${data.length} convoi(s) récupéré(s).`, 'ok');
                } else {
                    printLog(`ÉCHEC DE LA REQUÊTE. Analyse du message ci-dessus.`, 'err');
                }

            } catch (err) {
                printLog(`ERREUR JS / RÉSEAU CLIENT: ${err.message}`, 'err');
            }
        }
    </script>
</body>
</html>
