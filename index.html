<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance V — Convois</title>
    <script src="config.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff9800;
            --text: #ffffff;
            --text-dim: #aaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; text-align: center; color: var(--accent); margin-top: 0; }
        p { font-size: 0.95rem; color: var(--text-dim); line-height: 1.4; }
        .step { background: #2a2a2a; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
        .token-btn {
            display: block;
            background: #333;
            color: var(--accent);
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 6px;
            border: 1px solid var(--accent);
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button.secondary {
            background-color: #333;
            color: #fff;
            margin-top: 8px;
        }
        .convoy-item {
            border-bottom: 1px solid #333;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .convoy-item:last-child { border-bottom: none; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-giver { background-color: #e53935; color: #fff; }
        .badge-receiver { background-color: #43a047; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Alliance V — Convois</h1>

        <div id="login-box">
            <p>Pour consulter tes convois :</p>
            
            <div class="step">
                <b>1.</b> Clique ici pour ouvrir ton token :
                <a href="https://s5.fourmizzz.fr/api.php?getToken" target="_blank" class="token-btn">
                    🔑 Obtenir mon Token Fourmizzz
                </a>
            </div>

            <div class="step">
                <b>2.</b> Copie le token affiché et colle-le ici :
            </div>

            <input type="text" id="token-input" placeholder="Ex: 6ace5bb10f2a6">
            <button onclick="login()">Voir mes convois</button>
        </div>

        <div id="convoys-box" style="display:none;">
            <div id="convoys-list">Chargement...</div>
            <button class="secondary" onclick="logout()">Changer de Token</button>
        </div>
    </div>

    <script>
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (token) {
                document.getElementById('token-input').value = token;
                login(token);
            }
        };

        async function login(providedToken) {
            const token = providedToken || document.getElementById('token-input').value.trim();
            if (!token) return alert("Colle d'abord ton token Fourmizzz !");

            document.getElementById('login-box').style.display = 'none';
            document.getElementById('convoys-box').style.display = 'block';
            document.getElementById('convoys-list').innerHTML = "<p style='text-align:center;'>Vérification auprès de Fourmizzz...</p>";

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_my_convoys`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_token: token })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Token invalide ou membre non reconnu.");
                }

                renderConvoys(data);

            } catch (err) {
                alert("❌ Erreur : " + err.message);
                logout();
            }
        }

        function renderConvoys(convoys) {
            const container = document.getElementById('convoys-list');

            if (!convoys || convoys.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding: 20px 0;'>🎉 Aucun convoi à réaliser aujourd'hui !</p>";
                return;
            }

            let html = `<h3>Tes Convois du jour :</h3>`;

            convoys.forEach(c => {
                const isSender = c.is_giver ?? c.is_sender;
                const targetPseudo = c.target_pseudo || "Joueur";
                const badgeClass = isSender ? 'badge-giver' : 'badge-receiver';
                const roleText = isSender ? 'ENVOYER À' : 'RECEVOIR DE';
                const statusText = c.status === 'completed' ? '✅ Complété' : (c.status === 'failed' ? '⚠️ Échoué' : '⏳ En attente');

                html += `
                <div class="convoy-item">
                    <div>
                        <span class="badge ${badgeClass}">${roleText}</span>
                        <div style="font-size: 1.1rem; font-weight: bold; margin-top: 4px;">${escapeHtml(targetPseudo)}</div>
                        <div style="font-size: 0.85rem; color: #aaa;">Statut : ${statusText}</div>
                    </div>
                    <div style="text-align: right; font-weight: bold; font-size: 1.1rem; color: var(--accent);">
                        ${Number(c.amount).toLocaleString('fr-FR')} Bois
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function escapeHtml(str) {
            return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
        }

        function logout() {
            document.getElementById('token-input').value = '';
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('convoys-box').style.display = 'none';
        }
    </script>
</body>
</html>
