<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance V — Gestion des Convois</title>
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --primary-hover: #1a252f;
            --accent: #e67e22;
            --accent-hover: #d35400;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --text-muted: #7f8c8d;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .header-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0 0 20px 0;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Box de Connexion */
        .token-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .token-step {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .token-btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .token-btn:hover { background: var(--accent-hover); }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        button.btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        button.btn-primary:hover { background: var(--primary-hover); }

        /* Navigation et Onglets */
        .nav-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            background: #edf2f7;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .btn-logout {
            margin-left: auto;
            background: #e2e8f0;
            color: #4a5568;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .btn-logout:hover { background: #cbd5e0; }

        /* Tables & Cards */
        .section-title {
            font-size: 1.1rem;
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: white;
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr.row-failed { background: #fff5f5; }

        /* Badges & Boutons d'Action */
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.75rem;
            color: white;
            display: inline-block;
        }
        .badge-pending { background: var(--accent); }
        .badge-failed { background: var(--danger); }
        .badge-success { background: var(--success); }

        .btn-action {
            display: inline-block;
            padding: 6px 12px;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.75rem;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }

        .empty-msg {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="header-title">📦 Convois Alliance V</h1>

        <!-- Ecran 1 : Formulaire de Login -->
        <div id="auth-section" class="token-box">
            <div class="token-step">1. Récupération du Token Fourmizzz</div>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0;">
                Ouvrez le lien ci-dessous pour générer un jeton temporaire depuis votre compte de jeu :
            </p>
            <a href="https://s5.fourmizzz.fr/api.php?getToken" target="_blank" class="token-btn">🔑 Obtenir mon Token</a>
            
            <br><br>
            <div class="token-step">2. Validation de session (12 heures)</div>
            <input type="text" id="token-input" placeholder="Coller le token ici (ex: 6ace5bb10f2a6)">
            <button class="btn-primary" onclick="handleAuth()">Connexion au Tableau</button>
        </div>

        <!-- Ecran 2 : Dashboard de Convois -->
        <div id="dashboard-section" style="display:none;">
            <div class="nav-tabs">
                <button id="tab-active-btn" class="tab-btn active" onclick="switchTab('active')">En cours</button>
                <button id="tab-history-btn" class="tab-btn" onclick="switchTab('history')">📜 Historique</button>
                <button class="btn-logout" onclick="logout()">Changer de session</button>
            </div>

            <div id="content-area">Chargement des données...</div>
        </div>
    </div>

    <script>
        let activeTab = 'active';

        window.onload = () => {
            const savedSessionToken = localStorage.getItem('alliance_session_token');
            if (savedSessionToken) {
                showDashboard();
                loadTabContent();
            }
        };

        async function handleAuth() {
            const input = document.getElementById('token-input').value.trim();
            if (!input) return alert("Veuillez saisir un token Fourmizzz valide.");

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/login_with_fourmizzz_token`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_fourmizzz_token: input })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Token invalide ou déjà consommé.");

                const sessionData = data[0];
                localStorage.setItem('alliance_session_token', sessionData.session_token);

                showDashboard();
                loadTabContent();
            } catch (err) {
                alert("❌ Connexion échouée : " + err.message);
            }
        }

        function showDashboard() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-active-btn').className = `tab-btn ${tab === 'active' ? 'active' : ''}`;
            document.getElementById('tab-history-btn').className = `tab-btn ${tab === 'history' ? 'active' : ''}`;
            loadTabContent();
        }

        async function loadTabContent() {
            const sessionToken = localStorage.getItem('alliance_session_token');
            if (!sessionToken) return logout();

            const contentDiv = document.getElementById('content-area');
            contentDiv.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Chargement en cours...</p>";

            const rpcEndpoint = activeTab === 'active' ? 'get_my_convoys' : 'get_my_convoy_history';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${rpcEndpoint}`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_session_token: sessionToken })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Session expirée (12h). Veuillez vous re-connecter.");
                }

                if (activeTab === 'active') {
                    renderActiveConvoys(data);
                } else {
                    renderHistoryConvoys(data);
                }

            } catch (err) {
                alert("⚠️ " + err.message);
                logout();
            }
        }

        function renderActiveConvoys(convoys) {
            const contentDiv = document.getElementById('content-area');
            const toSend = convoys.filter(c => c.is_sender);
            const toReceive = convoys.filter(c => !c.is_sender);

            let html = `<div class="section-title" style="color: var(--accent);">📤 Convois à envoyer</div>`;
            html += renderTable(toSend, true);

            html += `<div class="section-title" style="color: var(--success); margin-top: 25px;">📥 Convois à recevoir</div>`;
            html += renderTable(toReceive, false);

            contentDiv.innerHTML = html;
        }

        function renderTable(list, isSender) {
            if (list.length === 0) return `<p class="empty-msg">Aucun convoi dans cette catégorie.</p>`;

            let html = `<div class="table-container"><table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Joueur</th>
                        <th>Montant</th>
                        <th>Statut</th>
                        ${isSender ? '<th>Action</th>' : ''}
                    </tr>
                </thead>
                <tbody>`;

            list.forEach(c => {
                const target = isSender ? c.to_player_pseudo : c.from_player_pseudo;
                const targetId = isSender ? c.to_player_id : c.from_player_id;
                const isFailed = c.status === 'failed';

                const statusBadge = isFailed 
                    ? `<span class="badge badge-failed">⚠️ Échoué</span>`
                    : `<span class="badge badge-pending">En attente</span>`;

                const actionBtn = isSender ? `
                    <a href="https://s5.fourmizzz.fr/commerce.php?ID=${targetId}&auto_convoy_id=${c.id}&auto_amount=${c.amount}" 
                       target="_blank" 
                       class="btn-action" 
                       style="background:${isFailed ? 'var(--danger)' : 'var(--accent)'};">
                        ${isFailed ? '🔄 Réessayer' : '🚀 Envoyer'}
                    </a>
                ` : '';

                html += `<tr class="${isFailed ? 'row-failed' : ''}">
                    <td>${c.balance_date}</td>
                    <td><strong>${escapeHtml(target)}</strong></td>
                    <td><strong>${Number(c.amount).toLocaleString('fr-FR')}</strong> Matériaux</td>
                    <td>${statusBadge}</td>
                    ${isSender ? `<td>${actionBtn}</td>` : ''}
                </tr>`;
            });

            return html + `</tbody></table></div>`;
        }

        function renderHistoryConvoys(historyList) {
            const contentDiv = document.getElementById('content-area');
            if (historyList.length === 0) {
                contentDiv.innerHTML = `<p class="empty-msg">Aucun convoi complété récemment.</p>`;
                return;
            }

            let html = `<div class="table-container"><table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Partenaire</th>
                        <th>Montant</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>`;

            historyList.forEach(c => {
                const target = c.is_sender ? c.to_player_pseudo : c.from_player_pseudo;
                const typeText = c.is_sender 
                    ? '<span style="color: var(--accent); font-weight: bold;">📤 Envoyé</span>' 
                    : '<span style="color: var(--success); font-weight: bold;">📥 Reçu</span>';

                html += `<tr>
                    <td>${c.balance_date}</td>
                    <td>${typeText}</td>
                    <td><strong>${escapeHtml(target)}</strong></td>
                    <td>${Number(c.amount).toLocaleString('fr-FR')} Matériaux</td>
                    <td><span class="badge badge-success">✅ Complété</span></td>
                </tr>`;
            });

            contentDiv.innerHTML = html + `</tbody></table></div>`;
        }

        function escapeHtml(str) {
            return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
        }

        function logout() {
            localStorage.removeItem('alliance_session_token');
            document.getElementById('token-input').value = '';
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('dashboard-section').style.display = 'none';
        }
    </script>
</body>
</html>
