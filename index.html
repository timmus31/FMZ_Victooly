<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance V - Mes Convois</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff9800;
            --text: #ffffff;
            --text-dim: #aaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; text-align: center; color: var(--accent); margin-top: 0; }
        p { font-size: 0.95rem; color: var(--text-dim); line-height: 1.4; }
        .step { background: #2a2a2a; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button.secondary {
            background-color: #333;
            color: #fff;
            margin-top: 8px;
        }
        .convoy-item {
            border-bottom: 1px solid #333;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .convoy-item:last-child { border-bottom: none; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-giver { background-color: #e53935; color: #fff; }
        .badge-receiver { background-color: #43a047; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Alliance V — Convois</h1>

        <!-- Formulaire de Connexion -->
        <div id="login-box">
            <p>Pour voir tes convois du jour :</p>
            
            <div class="step">
                <b>1.</b> Ouvre ce lien dans ton navigateur pour copier ton token :<br>
                <a href="https://s5.fourmizzz.fr/api.php?getToken" target="_blank" style="color: var(--accent);">
                    https://s5.fourmizzz.fr/api.php?getToken
                </a>
            </div>

            <div class="step">
                <b>2.</b> Colle ton token ci-dessous :
            </div>

            <input type="text" id="token-input" placeholder="Ex: 8a9f... ou 123456">
            <button onclick="handleLogin()">Voir mes convois</button>
        </div>

        <!-- Zone d'affichage des convois -->
        <div id="convoys-box" style="display:none;">
            <div id="convoys-list">Chargement...</div>
            <button class="secondary" onclick="logout()">Changer de Token / Déconnexion</button>
        </div>
    </div>

    <script src="config.js"></script>

    <script>
        // Au chargement : verification si une session locale valide existe (< 12h)
        window.onload = () => {
            const sessionData = getValidSession();
            if (sessionData) {
                // Joueur déjà authentifié récemment : chargement direct des convois sans repasser par l'API Fourmizzz !
                fetchConvoysByPlayerId(sessionData.playerId);
            } else {
                // Si le token a été passé dans l'URL
                const urlParams = new URLSearchParams(window.location.search);
                const urlToken = urlParams.get('token');
                if (urlToken) {
                    document.getElementById('token-input').value = urlToken;
                    handleLogin(urlToken);
                }
            }
        };
    
        function handleLogin(customToken) {
            const inputToken = customToken || document.getElementById('token-input').value.trim();
            if (!inputToken) {
                alert("Veuillez coller un token !");
                return;
            }
            verifyTokenAndLogin(inputToken);
        }
    
        // 1. Première connexion : Validation du token Fourmizzz auprès de Supabase
        async function verifyTokenAndLogin(token) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('convoys-box').style.display = 'block';
            document.getElementById('convoys-list').innerHTML = "<p style='text-align:center;'>Vérification du token Fourmizzz...</p>";
    
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_my_convoys`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_token: token })
                });
    
                const data = await response.json();
    
                if (!response.ok) {
                    throw new Error(data.message || "Token invalide ou non membre de l'alliance.");
                }
    
                // Si la réponse contient des convois, on récupère le player_id du premier convoi ou de la fonction
                // On sauvegarde la session locale pour 12 heures
                if (data && data.length > 0) {
                    const myPlayerId = data[0].is_giver ? data[0].from_player_id : data[0].to_player_id;
                    saveSession(myPlayerId);
                }
    
                renderConvoys(data);
    
            } catch (err) {
                alert("❌ Erreur : " + err.message);
                logout();
            }
        }
    
        // 2. Chargement direct sur F5 (sans ré-interroger Fourmizzz)
        async function fetchConvoysByPlayerId(playerId) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('convoys-box').style.display = 'block';
            document.getElementById('convoys-list').innerHTML = "<p style='text-align:center;'>Chargement des convois...</p>";
    
            try {
                // Lecture directe depuis daily_balances pour ce player_id
                const today = new Date();
                const yesterday = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() - 1));
                const dateStr = yesterday.toISOString().split('T')[0];
    
                const response = await fetch(`${SUPABASE_URL}/rest/v1/daily_balances?select=*,p_from:players!from_player_id(pseudo),p_to:players!to_player_id(pseudo)&balance_date=eq.${dateStr}&or=(from_player_id.eq.${playerId},to_player_id.eq.${playerId})`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
    
                const data = await response.json();
                
                // Formatage des données pour le render
                const formatted = data.map(c => ({
                    is_giver: c.from_player_id == playerId,
                    target_pseudo: c.from_player_id == playerId ? c.p_to?.pseudo : c.p_from?.pseudo,
                    amount: c.amount,
                    status: c.status
                }));
    
                renderConvoys(formatted);
    
            } catch (err) {
                console.error("Erreur refresh:", err);
                logout();
            }
        }
    
        // Gestion de la session en LocalStorage (expire après 12 heures)
        function saveSession(playerId) {
            const session = {
                playerId: playerId,
                expiry: new Date().getTime() + (12 * 60 * 60 * 1000) // 12h
            };
            localStorage.setItem('alliance_v_session', JSON.stringify(session));
        }
    
        function getValidSession() {
            const str = localStorage.getItem('alliance_v_session');
            if (!str) return null;
            try {
                const session = JSON.parse(str);
                if (new Date().getTime() > session.expiry) {
                    localStorage.removeItem('alliance_v_session');
                    return null;
                }
                return session;
            } catch(e) {
                return null;
            }
        }
    
        function renderConvoys(convoys) {
            const container = document.getElementById('convoys-list');
    
            if (!convoys || convoys.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding: 20px 0;'>🎉 Aucun convoi à réaliser aujourd'hui !</p>";
                return;
            }
    
            let html = `<h3>Tes Convois à effectuer :</h3>`;
    
            convoys.forEach(c => {
                const isSender = c.is_giver ?? c.is_sender;
                const targetPseudo = c.target_pseudo || "Joueur";
                const badgeClass = isSender ? 'badge-giver' : 'badge-receiver';
                const roleText = isSender ? 'ENVOYER À' : 'RECEVOIR DE';
                const statusText = c.status === 'completed' ? '✅ Complété' : (c.status === 'failed' ? '⚠️ Échoué' : '⏳ En attente');
    
                html += `
                <div class="convoy-item">
                    <div>
                        <span class="badge ${badgeClass}">${roleText}</span>
                        <div style="font-size: 1.1rem; font-weight: bold; margin-top: 4px;">${escapeHtml(targetPseudo)}</div>
                        <div style="font-size: 0.85rem; color: #aaa;">Statut : ${statusText}</div>
                    </div>
                    <div style="text-align: right; font-weight: bold; font-size: 1.1rem; color: var(--accent);">
                        ${Number(c.amount).toLocaleString('fr-FR')} Bois
                    </div>
                </div>`;
            });
    
            container.innerHTML = html;
        }
    
        function escapeHtml(str) {
            return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
        }
    
        function logout() {
            localStorage.removeItem('alliance_v_session');
            document.getElementById('token-input').value = '';
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('convoys-box').style.display = 'none';
        }
    </script>

</body>
</html>
